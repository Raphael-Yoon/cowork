<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Gentle Breeze / Vital Path Curve -->
  <path d="M12 40 C 22 28, 30 46, 42 26 C 48 18, 54 22, 54 22" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Leaf / Vitality Symbol -->
  <path d="M42 26 C 42 16, 32 18, 28 24 C 28 32, 38 34, 42 26 Z" fill="url(#leafGrad)" />
  <path d="M30 24 L 38 27" stroke="#ECFDF5" stroke-width="1.5" stroke-linecap="round"/>
</svg>
